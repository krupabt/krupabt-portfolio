<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.style.colorScheme = 'dark';
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23292522'/%3E%3Ctext x='50' y='65' font-size='48' font-family='Times New Roman, Times, serif' font-weight='800' fill='%23A8875A' text-anchor='middle'%3EKB%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KRUPA BT — Software Engineer Portfolio</title>
    <meta name="description" content="Portfolio of Krupa B T — Information Science Engineering student. Building practical AI and software solutions while continuously improving my DSA and development skills." />

    <style>
      /* Global Times New Roman Typography */
      *, *::before, *::after, html, body, button, input, select, textarea {
        font-family: "Times New Roman", Times, serif !important;
      }

      /* Smooth refined luxury scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F7F3ED;
      }
      html.dark ::-webkit-scrollbar-track {
        background: #141210;
      }
      ::-webkit-scrollbar-thumb {
        background: #DED3C5;
        border-radius: 9999px;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #38332E;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #A8875A;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #C4A67B;
      }
    </style>
  </head>
  <body class="bg-[#F7F3ED] dark:bg-[#141210] text-[#5F5750] dark:text-[#D1C8C0] antialiased selection:bg-[#A8875A]/25 dark:selection:bg-[#C4A67B]/30 selection:text-[#292522] dark:selection:text-[#F5EFEB] overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
